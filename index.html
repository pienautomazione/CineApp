<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CineApp · Biglietteria & Orari</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#0a0a0c; color:#f4f4f6; -webkit-tap-highlight-color:transparent; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
  </style>
</head>
<body class="min-h-screen pb-24 font-sans antialiased">

  <header class="sticky top-0 z-30 bg-[#0a0a0c]/95 backdrop-blur-md border-b border-white/10 px-4 pt-4 pb-3.5">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-3">
        <div>
          <span class="text-[11px] font-semibold uppercase tracking-widest text-amber-400">Biglietteria Ufficiale</span>
          <h1 class="text-2xl font-bold tracking-tight text-white">CineApp</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="resetBtn" onclick="resetAll()" class="hidden text-xs text-amber-400 px-2 py-1">Azzera</button>
          <span id="movieCount" class="text-xs bg-white/10 text-zinc-300 px-2.5 py-1 rounded-full">Caricamento...</span>
        </div>
      </div>

      <div class="relative mb-2.5">
        <input id="titleInput" type="text" autocomplete="off" placeholder="Cerca titolo del film..."
          class="w-full bg-white/10 text-white placeholder-zinc-400 text-sm rounded-xl pl-9 pr-8 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-400/60" />
        <span class="absolute left-3 top-2.5 text-zinc-400 text-sm">🔍</span>
        <button id="clearBtn" onclick="clearTitle()" class="hidden absolute right-3 top-2.5 text-zinc-400 text-sm">✕</button>
        <div id="suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-[#18181f] border border-white/15 rounded-xl shadow-2xl overflow-hidden z-40 max-h-56 overflow-y-auto"></div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-2.5">
        <select id="citySelect" onchange="onCityChange()" class="w-full bg-white/10 text-white text-sm rounded-xl px-3.5 py-2.5 focus:outline-none">
          <option value="" class="bg-[#141418]">1. Seleziona Città...</option>
        </select>
        <select id="cinemaSelect" disabled onchange="renderMovies()" class="w-full bg-white/10 text-white text-sm rounded-xl px-3.5 py-2.5 disabled:opacity-40 focus:outline-none">
          <option value="" class="bg-[#141418]">2. Prima scegli una città</option>
        </select>
      </div>

      <div class="flex gap-2 overflow-x-auto no-scrollbar">
        <button onclick="setLang('ALL')" id="btnALL" class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-400 text-black">Tutte le lingue</button>
        <button onclick="setLang('OV')" id="btnOV" class="px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-zinc-300">🌍 Versione Originale (V.O.)</button>
        <button onclick="setLang('ITA')" id="btnITA" class="px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-zinc-300">🇮🇹 Italiano</button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-4">
    <div id="moviesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  </main>

  <!-- Scheda Film Completa -->
  <div id="movieModal" class="fixed inset-0 z-50 hidden bg-[#0a0a0c] sm:bg-black/85 sm:backdrop-blur-md overflow-y-auto">
    <div class="min-h-screen sm:min-h-0 sm:my-8 sm:mx-auto sm:max-w-xl bg-[#121216] sm:border sm:border-white/15 sm:rounded-3xl overflow-hidden shadow-2xl pb-12">
      <div class="relative w-full h-80 sm:h-96 bg-zinc-900">
        <img id="modalPoster" src="" alt="" class="w-full h-full object-cover hidden" />
        <div id="modalPosterFallback" class="w-full h-full bg-gradient-to-br from-amber-900/40 via-zinc-900 to-[#121216]"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#121216] via-[#121216]/45 to-transparent"></div>
        <button onclick="closeModal()" class="fixed sm:absolute top-4 right-4 z-50 w-10 h-10 rounded-full bg-black/70 border border-white/20 text-white flex items-center justify-
