<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CineApp Roma · Biglietteria & Orari</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0a0a0c; color: #f4f4f6; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-24 font-sans antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#0a0a0c]/90 backdrop-blur-md border-b border-white/10 px-4 pt-4 pb-3">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-3">
        <div>
          <span class="text-[11px] font-semibold uppercase tracking-widest text-amber-400">Roma · In Sala Oggi</span>
          <h1 class="text-2xl font-bold tracking-tight text-white">CineApp</h1>
        </div>
        <span id="movieCount" class="text-xs bg-white/10 text-zinc-300 px-2.5 py-1 rounded-full">Caricamento...</span>
      </div>

      <!-- Barra di ricerca -->
      <div class="relative mb-3">
        <input
          id="searchInput"
          type="text"
          placeholder="Cerca film, cinema (es. Adriano, Troisi) o zona..."
          class="w-full bg-white/10 text-white placeholder-zinc-400 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-400/60"
        />
        <svg class="w-4 h-4 text-zinc-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
        </svg>
      </div>

      <!-- Filtri Zona -->
      <div id="zoneFilters" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>
    </div>
  </header>

  <!-- Feed Film -->
  <main class="max-w-3xl mx-auto px-4 pt-4">
    <div id="moviesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  </main>

  <!-- Modale Dettaglio & Biglietti -->
  <div id="movieModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center">
    <div class="bg-[#141418] border border-white/10 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[88vh] overflow-y-auto p-5 shadow-2xl">
      <div class="flex justify-between items-start gap-3 mb-3">
        <div>
          <span id="modalTag" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-amber-500/20 text-amber-300">ROMA</span>
          <h2 id="modalTitle" class="text-xl font-bold text-white mt-1"></h2>
          <p id="modalMeta" class="text-xs text-zinc-400 mt-0.5"></p>
        </div>
        <button onclick="closeModal()" class="p-2 rounded-full bg-white/10 text-zinc-300 hover:bg-white/20">✕</button>
      </div>

      <p id="modalSynopsis" class="text-sm text-zinc-300 leading-relaxed mb-4"></p>

      <h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2.5">Sale e Orari · Tocca per acquistare</h3>
      <div id="modalScreenings" class="space-y-3"></div>
    </div>
  </div>

  <script>
    let allMovies = [];
    let selectedZone = "Tutte";

    async function loadMovies() {
      try {
        // Parametro timestamp per evitare che Safari mostri vecchi file in cache
        const res = await fetch(`./movies.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Errore caricamento movies.json");
        allMovies = await res.json();
        renderZoneFilters();
        renderMovies();
      } catch (err) {
        document.getElementById("moviesGrid").innerHTML = `
          <div class="col-span-full text-center py-12 text-zinc-400 text-sm">
            Impossibile caricare i palinsesti al momento. Riprova tra qualche secondo.
          </div>`;
      }
    }

    function renderZoneFilters() {
      const zones = new Set(["Tutte"]);
      allMovies.forEach(m => (m.screenings || []).forEach(s => { if (s.zone) zones.add(s.zone); }));

      const container = document.getElementById("zoneFilters");
      container.innerHTML = Array.from(zones).map(zone => `
        <button
          onclick="setZone('${zone.replace(/'/g, "\\'")}')"
          class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${
            selectedZone === zone
              ? "bg-amber-400 text-black font-semibold"
              : "bg-white/10 text-zinc-300 hover:bg-white/15"
          }">
          ${zone}
        </button>
      `).join("");
    }

    function setZone(zone) {
      selectedZone = zone;
      renderZoneFilters();
      renderMovies();
    }

    function renderMovies() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = allMovies.filter(movie => {
        const screenings = movie.screenings || [];
        const matchesZone = selectedZone === "Tutte" || screenings.some(s => s.zone === selectedZone);
        const matchesQuery = !q ||
          movie.title.toLowerCase().includes(q) ||
          screenings.some(s => s.cinema.toLowerCase().includes(q) || (s.zone || "").toLowerCase().includes(q));
        return matchesZone && matchesQuery;
      });

      document.getElementById("movieCount").textContent = `${filtered.length} film`;
      const grid = document.getElementById("moviesGrid");

      if (!filtered.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-400 text-sm">Nessun film trovato per i filtri selezionati.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(movie => {
        const screenings = selectedZone === "Tutte"
          ? (movie.screenings || [])
          : (movie.screenings || []).filter(s => s.zone === selectedZone);

        const posterHtml = movie.posterUrl
          ? `<img src="${movie.posterUrl}" alt="${movie.title}" class="w-full h-48 object-cover" loading="lazy" onerror="this.style.display='none'" />`
          : `<div class="w-full h-36 bg-gradient-to-br ${movie.gradient || 'from-zinc-800 to-zinc-950'} flex items-end p-4">
               <span class="text-xs uppercase tracking-widest text-white/50 font-semibold">Roma · Biglietteria Ufficiale</span>
             </div>`;

        const cinemasPreview = screenings.slice(0, 2).map(s => `
          <div class="mt-2 pt-2 border-t border-white/10">
            <div class="flex justify-between items-center text-xs">
              <span class="font-semibold text-zinc-200">${s.cinema}</span>
              <span class="text-zinc-400">${s.zone}</span>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-1.5">
              ${s.times.slice(0, 5).map(t => `
                <a href="${s.bookingUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()"
                   class="px-2 py-0.5 rounded bg-amber-400/15 text-amber-300 border border-amber-400/30 text-xs font-medium hover:bg-amber-400 hover:text-black transition">
                  ${t}
                </a>
              `).join("")}
            </div>
          </div>
        `).join("");

        return `
          <article onclick="openModal(${movie.id})" class="bg-[#141418] border border-white/10 rounded-2xl overflow-hidden shadow-lg active:scale-[0.99] transition cursor-pointer">
            ${posterHtml}
            <div class="p-4">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${movie.accent || 'bg-amber-500/20 text-amber-300'}">${movie.tag || 'ROMA'}</span>
                <span class="text-xs text-zinc-400">${screenings.length} ${screenings.length === 1 ? 'sala' : 'sale'}</span>
              </div>
              <h2 class="text-lg font-bold text-white leading-snug">${movie.title}</h2>
              ${cinemasPreview}
            </div>
          </article>
        `;
      }).join("");
    }

    function openModal(id) {
      const movie = allMovies.find(m => m.id === id);
      if (!movie) return;

      document.getElementById("modalTitle").textContent = movie.title;
      document.getElementById("modalMeta").textContent = `${movie.genre || 'In Sala'} · ${movie.duration || 'Oggi'}`;
      document.getElementById("modalSynopsis").textContent = movie.synopsis || "";

      const list = document.getElementById("modalScreenings");
      list.innerHTML = (movie.screenings || []).map(s => `
        <div class="bg-white/5 border border-white/10 rounded-xl p-3">
          <div class="flex justify-between items-center mb-2">
            <span class="font-semibold text-sm text-white">${s.cinema}</span>
            <span class="text-xs text-zinc-400">${s.zone}</span>
          </div>
          <div class="flex flex-wrap gap-2">
            ${s.times.map(t => `
              <a href="${s.bookingUrl}" target="_blank" rel="noopener"
                 class="px-3 py-1.5 rounded-lg bg-amber-400 text-black text-xs font-bold hover:bg-amber-300 transition">
                ${t} · Prenota
              </a>
            `).join("")}
          </div>
        </div>
      `).join("");

      document.getElementById("movieModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("movieModal").classList.add("hidden");
    }

    document.getElementById("searchInput").addEventListener("input", renderMovies);
    loadMovies();
  </script>
</body>
</html>
