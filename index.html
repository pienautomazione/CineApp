<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CineApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:#0a0a0c;color:#f4f4f6;-webkit-tap-highlight-color:transparent}.no-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body class="min-h-screen pb-24 font-sans antialiased">
  <header class="sticky top-0 z-30 bg-[#0a0a0c]/95 backdrop-blur-md border-b border-white/10 px-4 pt-4 pb-3.5">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-3">
        <div><span class="text-[11px] font-semibold uppercase tracking-widest text-amber-400">Biglietteria Ufficiale</span><h1 class="text-2xl font-bold text-white">CineApp</h1></div>
        <div class="flex items-center gap-2"><button id="resetBtn" onclick="resetAll()" class="hidden text-xs text-amber-400 px-2 py-1">Azzera</button><span id="movieCount" class="text-xs bg-white/10 text-zinc-300 px-2.5 py-1 rounded-full">...</span></div>
      </div>
      <div class="relative mb-2.5">
        <input id="titleInput" type="text" autocomplete="off" placeholder="Cerca titolo del film..." class="w-full bg-white/10 text-white placeholder-zinc-400 text-sm rounded-xl pl-9 pr-8 py-2.5 focus:outline-none" />
        <span class="absolute left-3 top-2.5 text-zinc-400 text-sm">🔍</span>
        <button id="clearBtn" onclick="clearTitle()" class="hidden absolute right-3 top-2.5 text-zinc-400 text-sm">✕</button>
        <div id="suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-[#18181f] border border-white/15 rounded-xl shadow-2xl z-40 max-h-56 overflow-y-auto"></div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-2.5">
        <select id="citySelect" onchange="onCityChange()" class="w-full bg-white/10 text-white text-sm rounded-xl px-3.5 py-2.5"><option value="" class="bg-[#141418]">1. Seleziona Città...</option></select>
        <select id="cinemaSelect" disabled onchange="render()" class="w-full bg-white/10 text-white text-sm rounded-xl px-3.5 py-2.5 disabled:opacity-40"><option value="" class="bg-[#141418]">2. Prima scegli una città</option></select>
      </div>
      <div class="flex gap-2 overflow-x-auto no-scrollbar">
        <button onclick="setLang('ALL')" id="btnALL" class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-400 text-black">Tutte le lingue</button>
        <button onclick="setLang('OV')" id="btnOV" class="px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-zinc-300">🌍 Versione Originale (V.O.)</button>
        <button onclick="setLang('ITA')" id="btnITA" class="px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-zinc-300">🇮🇹 Italiano</button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-4"><div id="grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div></main>

  <div id="modal" class="fixed inset-0 z-50 hidden bg-[#0a0a0c] overflow-y-auto">
    <div class="min-h-screen max-w-xl mx-auto bg-[#121216] pb-12">
      <div class="relative w-full h-80 bg-zinc-900">
        <img id="mImg" class="w-full h-full object-cover hidden" />
        <div id="mFb" class="w-full h-full bg-gradient-to-br from-amber-900/40 via-zinc-900 to-[#121216]"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#121216] via-[#121216]/45 to-transparent"></div>
        <button onclick="closeModal()" class="fixed top-4 right-4 z-50 w-10 h-10 rounded-full bg-black/70 border border-white/20 text-white">✕</button>
        <div class="absolute bottom-3 left-5 right-5"><h2 id="mTitle" class="text-2xl font-extrabold text-white"></h2></div>
      </div>
      <div class="px-5 pt-2"><p id="mMeta" class="text-xs text-zinc-400 mb-4"></p><div id="mList" class="space-y-3"></div></div>
    </div>
  </div>

  <script>
    let movies=[], lang="ALL", exp=new Set(), pCache={};
    async function getPoster(t, u){
      if(u && u.startsWith("http")) return u;
      if(pCache[t]!==undefined) return pCache[t];
      const q=t.replace(/\([^)]*\)|\[[^\]]*\]/g,"").trim().toLowerCase();
      for(const c of ["it","us"]){
        try{
          const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=movie&country=${c}&limit=5`),d=await r.json();
          const hit=(d.results||[]).find(x=>(x.trackName||"").toLowerCase().trim()===q);
          if(hit?.artworkUrl100) return pCache[t]=hit.artworkUrl100.replace("100x100bb","600x600bb");
        }catch(e){}
      }
      return pCache[t]="";
    }
    async function load(){
      const r=await fetch(`./movies.json?t=${Date.now()}`); movies=await r.json();
      const cities=[...new Set(movies.flatMap(m=>(m.screenings||[]).map(s=>s.city)))].sort();
      citySelect.innerHTML=`<option value="" class="bg-[#141418]">1. Tutte le città (${cities.length})</option>`+cities.map(c=>`<option value="${c}" class="bg-[#141418]">${c}</option>`).join("");
      render();
      for(const m of movies){if(!m.posterUrl){const p=await getPoster(m.title,"");if(p){m.posterUrl=p;const i=document.getElementById("pi-"+m.id),f=document.getElementById("pf-"+m.id);if(i&&f){i.src=p;i.classList.remove("hidden");f.classList.add("hidden");}}}}
    }
    const times=s=>(s.showtimes?.length?s.showtimes:(s.times||[]).map(t=>({time:t,url:s.bookingUrl||"#"})));
    const fSc=(l,c,ci)=>(l||[]).filter(s=>(!c||s.city===c)&&(!ci||s.cinema===ci)&&(lang!=="OV"||s.isOV)&&(lang!=="ITA"||!s.isOV));
    function setLang(k){lang=k;["ALL","OV","ITA"].forEach(x=>document.getElementById("btn"+x).className=x===k?"px-3 py-1 rounded-full text-xs font-semibold bg-amber-400 text-black":"px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-zinc-300");render();}
    function onCityChange(){const c=citySelect.value;if(!c){cinemaSelect.disabled=true;cinemaSelect.innerHTML=`<option value="">2. Prima scegli una città</option>`;return render();}const cs=[...new Set(movies.flatMap(m=>(m.screenings||[]).filter(s=>s.city===c).map(s=>s.cinema)))].sort();cinemaSelect.disabled=false;cinemaSelect.innerHTML=`<option value="" class="bg-[#141418]">Tutti i cinema (${cs.length})</option>`+cs.map(x=>`<option value="${x}" class="bg-[#141418]">${x}</option>`).join("");render();}
    function tog(e,id){e.stopPropagation();exp.has(id)?exp.delete(id):exp.add(id);render();}
    function clearTitle(){titleInput.value="";clearBtn.classList.add("hidden");suggestions.classList.add("hidden");render();}
    function resetAll(){titleInput.value="";clearBtn.classList.add("hidden");citySelect.value="";setLang("ALL");onCityChange();}
    function render(){
      const q=titleInput.value.toLowerCase().trim(),c=citySelect.value,ci=cinemaSelect.value;
      resetBtn.classList.toggle("hidden",!(q||c||ci||lang!=="ALL"));
      const list=movies.filter(m=>(!q||m.title.toLowerCase().includes(q))&&fSc(m.screenings,c,ci).length>0);
      movieCount.textContent=`${list.length} film`;
      grid.innerHTML=list.map(m=>{
        const sc=fSc(m.screenings,c,ci),isE=exp.has(m.id),vis=isE?sc:sc.slice(0,4),hid=sc.length-4;
        return `<article onclick="openM(${m.id})" class="bg-[#141418] border border-white/10 rounded-2xl overflow-hidden shadow-lg cursor-pointer flex flex-col">
          <div class="w-full h-64 bg-zinc-900 relative overflow-hidden">
            <img id="pi-${m.id}" src="${m.posterUrl||''}" class="w-full h-full object-cover ${m.posterUrl?'':'hidden'}" onerror="this.classList.add('hidden');document.getElementById('pf-${m.id}').classList.remove('hidden')" />
            <div id="pf-${m.id}" class="w-full h-full bg-gradient-to-br ${m.gradient||'from-zinc-800 to-zinc-950'} ${m.posterUrl?'hidden':''}"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[#141418] via-[#141418]/45 to-transparent"></div>
            <div class="absolute bottom-3 left-4 right-4">
              <div class="flex justify-between items-center mb-1"><div class="flex gap-1.5"><span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-400 text-black">ROMA</span>${sc.some(s=>s.isOV)?`<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-sky-500/30 text-sky-200">V.O.</span>`:''}</div><span class="text-[11px] bg-black/50 px-2 py-0.5 rounded-full">${sc.length} sale</span></div>
              <h2 class="text-xl font-extrabold text-white leading-tight">${m.title}</h2>
            </div>
          </div>
          <div class="px-4 pb-4 pt-1 flex-1 flex flex-col justify-between">
            <div>${vis.map(s=>`<div class="mt-2 pt-2 border-t border-white/10"><div class="flex justify-between text-xs"><span class="font-semibold text-zinc-200 truncate">${s.cinema}</span><span class="text-zinc-400 shrink-0">${s.isOV?'V.O. · ':''}${s.zone||s.city}</span></div><div class="flex flex-wrap gap-1.5 mt-1.5">${times(s).map(st=>`<a href="${st.url}" target="_blank" onclick="event.stopPropagation()" class="px-2 py-0.5 rounded bg-amber-400/15 text-amber-300 border border-amber-400/30 text-xs">${st.time}</a>`).join("")}</div></div>`).join("")}</div>
            ${hid>0?`<button onclick="tog(event,${m.id})" class="mt-3 w-full py-2 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-amber-400">${isE?'▲ Mostra meno sale':`+ Espandi altre ${hid} sale`}</button>`:''}
          </div></article>`;
      }).join("");
    }
    async function openM(id){
      const m=movies.find(x=>x.id===id);if(!m)return;const sc=fSc(m.screenings,citySelect.value,cinemaSelect.value);
      mTitle.textContent=m.title;mMeta.textContent=`${sc.length} sale disponibili oggi`;
      const p=await getPoster(m.title,m.posterUrl);
      if(p){mImg.src=p;mImg.classList.remove("hidden");mFb.classList.add("hidden");}else{mImg.classList.add("hidden");mFb.classList.remove("hidden");}
      mList.innerHTML=sc.map(s=>`<div class="bg-white/5 border border-white/10 rounded-2xl p-3.5"><div class="flex justify-between mb-2"><span class="font-bold text-white">${s.cinema}</span><span class="text-xs text-sky-300">${s.isOV?'🌍 V.O. · Sub ITA':'🇮🇹 Italiano'}</span></div><div class="flex flex-wrap gap-2">${times(s).map(st=>`<a href="${st.url}" target="_blank" class="px-3 py-1.5 rounded-xl bg-amber-400 text-black text-xs font-extrabold">Vai alla sala · ${st.time}</a>`).join("")}</div></div>`).join("");
      modal.classList.remove("hidden");
    }
    function closeModal(){modal.classList.add("hidden");}
    titleInput.addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();clearBtn.classList.toggle("hidden",!q);if(!q){suggestions.classList.add("hidden");return render();}const ms=movies.filter(m=>m.title.toLowerCase().includes(q)).slice(0,6);suggestions.innerHTML=ms.map(m=>`<button onclick="titleInput.value='${m.title.replace(/'/g,"\\'")}';suggestions.classList.add('hidden');render()" class="w-full text-left px-3 py-2 text-sm text-zinc-200 border-b border-white/5">${m.title}</button>`).join("");suggestions.classList.toggle("hidden",!ms.length);render();});
    load();
  </script>
</body>
</html>
